# Vuelve a publicar una versión ya liberada (tag vX.Y.Z), p. ej. para regresar
# a una anterior: Actions → Desplegar → Run workflow. Las versiones nuevas las
# publica release.yml. Siempre espera aprobación en «production».
name: Desplegar
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Versión a publicar (tag, p. ej. v0.2.0)"
        type: string
        required: true
permissions: {}
concurrency:
  group: produccion
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://estado.tocaltepetl.org
    permissions:
      contents: read
    steps:
      - name: Validar versión
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::«$REF» no es un tag de versión (vX.Y.Z)."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.ref }}
          persist-credentials: false
      - name: Poner la versión en la página
        env:
          VERSION: ${{ inputs.ref }}
        run: |
          # Los tags anteriores a v0.2.0 ya traen la versión escrita; ahí no cambia nada.
          sed -i -E "s|(class=\"ver\"[^>]*>)[^<]*(</a>)|\1$VERSION\2|" public/index.html
      - name: Desplegar a producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ inputs.ref }}
        run: npx -y wrangler@4.160.1 deploy --message "$REF"
