# Publica a mano: Actions → Desplegar → Run workflow. Acepta un tag (vX.Y.Z),
# p. ej. para regresar a una versión anterior, o `main`, para publicar cambios
# que no generan versión (PRs `docs`, `chore`…). Las versiones nuevas las
# publica release.yml. Siempre espera aprobación en «production».
name: Desplegar
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag a publicar (p. ej. v0.2.0) o main"
        type: string
        required: true
permissions: {}
concurrency:
  group: produccion
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://estado.tocaltepetl.org
    permissions:
      contents: read
    steps:
      - name: Validar versión
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$REF" == main ]]; then echo "git=refs/heads/main" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "git=refs/tags/$REF" >> "$GITHUB_OUTPUT"
          else echo "::error::«$REF» no es un tag de versión (vX.Y.Z) ni main."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.git }}
          fetch-depth: 0
          persist-credentials: false
      - name: Poner la versión en la página
        run: |
          # Un tag queda tal cual; main se ve como v0.9.0-2-gabc1234 (último tag,
          # commits desde él y commit), para distinguirlo de una versión liberada.
          VERSION=$(git describe --tags --abbrev=7)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Los tags anteriores a v0.2.0 ya traen la versión escrita; ahí no cambia nada.
          sed -i -E "s|(class=\"ver\"[^>]*>)[^<]*(</a>)|\1$VERSION\2|" public/index.html
      - name: Desplegar a producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.160.1 deploy --message "$VERSION"
