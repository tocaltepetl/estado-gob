# Revisa que el título del PR siga Conventional Commits. Con squash merge, el
# título se vuelve el commit en main, y de ahí salen la versión y las notas.
name: Título del PR
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  titulo:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar formato
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|docs|refactor|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "✅ «$TITLE»"
          else
            {
              echo "### ❌ El título del PR no sigue el formato"
              echo
              echo "Título actual: «$TITLE»"
              echo
              echo "Usa \`tipo: descripción\`, por ejemplo:"
              echo "- \`feat: muestra la hora estimada de llegada\` (novedad → versión 0.**X**.0)"
              echo "- \`fix: el pin no se mueve en iOS\` (corrección → versión 0.0.**X**)"
              echo "- \`docs: …\`, \`refactor: …\`, \`chore: …\` (no publican versión por sí solos)"
              echo
              echo "Detalles en CONTRIBUTING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::El título del PR no sigue Conventional Commits (ver el resumen del job)."
            exit 1
          fi
