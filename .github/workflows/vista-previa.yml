# Vista previa de los PR que vienen de ramas de este repo: sube una versión del
# Worker que NO toca producción y comenta su URL en el PR.
# Los PR desde forks no tienen acceso al token; ver vista-previa-fork.yml.
name: Vista previa
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: vista-previa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  subir:
    # Solo ramas de este repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.subir.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Subir versión de vista previa
        id: subir
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! out=$(npx -y wrangler@4.160.1 versions upload --preview-alias "pr-$PR" --message "PR #$PR (${SHA:0:7})" 2>&1); then
            echo "$out"
            # Antes del primer despliegue a producción no hay Worker al que subir versiones.
            if grep -q "does not yet exist" <<<"$out"; then
              echo "::notice::Aún no hay despliegue en producción; la vista previa estará disponible después del primero."
              echo "url=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            exit 1
          fi
          echo "$out"
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' <<<"$out" | tail -1)
          [ -n "$url" ] || url=$(grep -oE 'https://[^ ]+\.workers\.dev' <<<"$out" | tail -1)
          [ -n "$url" ] || { echo "::error::No se encontró la URL de vista previa en la salida de wrangler."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.subir.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            body="<!-- vista-previa -->
          🔎 **Vista previa:** todavía no disponible: se activa después del primer despliegue a producción."
          else
          body="<!-- vista-previa -->
          🔎 **Vista previa:** $URL

          Commit \`${SHA:0:7}\` · se actualiza con cada push · no afecta producción."
          fi
          marker="<!-- vista-previa -->"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
